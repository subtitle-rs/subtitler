name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        features:
          - ""
          - "--no-default-features --features srt"
          - "--no-default-features --features dfxp,ttml"
        include:
          - features: ""
            test-args: "--all-targets"
          - features: "--no-default-features --features srt"
            test-args: "--all-targets"
          - features: "--no-default-features --features dfxp,ttml"
            test-args: "--all-targets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose ${{ matrix.features }}
      - run: cargo test --verbose ${{ matrix.features }} ${{ matrix.test-args }}

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --examples --verbose

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --lib --verbose

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli matching the lockfile
        run: |
          VER=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$VER"
      - name: Run wasm-bindgen tests (node)
        run: |
          export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=$(which wasm-bindgen-test-runner)
          cargo test --target wasm32-unknown-unknown --lib --no-default-features --features srt,vtt

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --verbose
      - run: cargo test --verbose

  clippy-matrix:
    strategy:
      matrix:
        include:
          # Full feature set: check all targets (lib, tests, examples, benches)
          - features: ""
            targets: "--all-targets"
          # Minimal builds: all targets now compile under feature gates
          # (tests/examples/benches carry per-format cfgs since v2.11)
          - features: "--no-default-features --features srt"
            targets: "--all-targets"
          - features: "--no-default-features --features dfxp,ttml"
            targets: "--all-targets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy ${{ matrix.targets }} ${{ matrix.features }} -- -D warnings

  bench:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[bench]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo bench --no-run
