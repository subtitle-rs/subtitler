[package]
authors = [
  "siwilizhao <siwilizhao@gmail.com>",
] 
categories = [
  "text-processing",
  "multimedia",
  "parser-implementations",
] 
description = "Parse, convert, validate, edit, and generate subtitles in 17 formats (SRT, VTT, ASS/SSA, MicroDVD, SubViewer, TTML, SBV, LRC, SAMI, MPL2, SCC, EBU STL, Spruce STL, DFXP, iTT, Whisper JSON). Full CLI included." 
documentation = "https://docs.rs/subtitler" 
edition = "2024" 
keywords = [
  "subtitle",
  "srt",
  "vtt",
  "ass",
  "parser",
] 
license = "Apache-2.0" 
name = "subtitler" 
publish = true
readme = "README.md" 
repository = "https://github.com/subtitle-rs/subtitler" 
rust-version = "1.85"
version = "2.12.0"

include = [
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
  "MIGRATION.md",
  "src/**/*",
  "examples/**/*",
  "tests/**/*",
  "benches/**/*",
]

[dependencies]
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
chardetng = "1"
clap = {version = "4", features = ["derive"], optional = true}
encoding_rs = "0.8"
quick-xml = {version = "0.41", optional = true}
regex = "1"
reqwest = {version = "0.13", optional = true, default-features = false, features = ["rustls"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
smallvec = {version = "1", features = ["write", "const_new", "serde"]}
thiserror = "2"
tracing = "0.1"
tracing-subscriber = {version = "0.3", optional = true}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = {version = "1", features = ["fs", "io-util", "rt", "macros"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[dev-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = ">=0.5, <0.8"
proptest = "1.5"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["cli", "srt", "vtt", "ass", "ssa", "microdvd", "subviewer", "ttml", "sbv", "lrc", "sami", "mpl2", "scc", "ebu_stl", "dfxp", "itt", "spruce", "whisper", "http"]

cli = ["dep:clap", "dep:tracing-subscriber"]

srt = []
vtt = []
ass = []
ssa = ["ass"]
microdvd = []
subviewer = []
ttml = ["quick-xml"]
sbv = []
lrc = []
sami = []
mpl2 = []
scc = []
ebu_stl = []
dfxp = []
itt = []
spruce = []
whisper = []
http = ["reqwest"]
wasm = []

[[bin]]
name = "subtitler"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[example]]
name = "parse-srt-file"
path = "examples/parse-srt-file.rs"

required-features = ["srt", "cli"]
[[example]]
name = "parse-srt-http"
path = "examples/parse-srt-http.rs"
required-features = ["http", "srt", "cli"]

[[example]]
name = "create-srt-file"
path = "examples/create-srt-file.rs"

required-features = ["srt", "cli"]
[[example]]
name = "parse-srt-content"
path = "examples/parse-srt-content.rs"

required-features = ["srt", "cli"]
[[example]]
name = "parse-vtt-file"
path = "examples/parse-vtt-file.rs"

required-features = ["vtt", "cli"]
[[example]]
name = "parse-vtt-http"
path = "examples/parse-vtt-http.rs"
required-features = ["http", "vtt", "cli"]

[[example]]
name = "parse-vtt-content"
path = "examples/parse-vtt-content.rs"

required-features = ["vtt", "cli"]
[[example]]
name = "create-vtt-file"
path = "examples/create-vtt-file.rs"

required-features = ["vtt", "cli"]
[[example]]
name = "parse-ass-content"
path = "examples/parse-ass-content.rs"

required-features = ["ass", "cli"]
[[example]]
name = "format-convert"
path = "examples/format-convert.rs"

required-features = ["ass", "srt", "vtt", "cli"]
[[example]]
name = "frame-conversion"
path = "examples/frame-conversion.rs"

required-features = ["cli"]
[[example]]
name = "stream-parse"
path = "examples/stream-parse.rs"

required-features = ["srt"]
[[example]]
name = "quality-report"
path = "examples/quality-report.rs"

[[example]]
name = "normalize-text"
path = "examples/normalize-text.rs"

[[example]]
name = "convert-all-formats"
path = "examples/format-convert-all.rs"

required-features = ["ass", "microdvd", "srt", "subviewer", "vtt"]
[[example]]
name = "edit-operations"
path = "examples/edit-operations.rs"

required-features = ["srt"]
[[example]]
name = "parse-ttml-lrc"
path = "examples/ttml-lyrics-tutorial.rs"

required-features = ["lrc", "sbv", "srt", "ttml"]
[[example]]
name = "detect-and-validate"
path = "examples/validate-subtitle.rs"

[[example]]
name = "batch-process"
path = "examples/translate-subtitle.rs"

required-features = ["vtt"]
[[example]]
name = "parse-sami-content"
path = "examples/parse-sami-content.rs"

required-features = ["sami"]
[[example]]
name = "parse-mpl2-content"
path = "examples/parse-mpl2-content.rs"

required-features = ["mpl2"]
[[example]]
name = "create-sami-file"
path = "examples/create-sami-file.rs"

required-features = ["sami"]
[[example]]
name = "create-mpl2-file"
path = "examples/create-mpl2-file.rs"

required-features = ["mpl2"]
[[bench]]
name = "subtitler_benchmark"
harness = false
# The bench exercises the SRT/VTT/ASS parsers and their Format variants;
# without this gate it fails to compile under minimal feature sets.
required-features = ["srt", "vtt", "ass"]
